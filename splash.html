<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NetCafe PRO - Loading</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: rgba(15, 23, 42, 0.95); /* Slate 900 with some transparency */
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-app-region: drag; /* Makes the splash screen draggable */
      overflow: hidden;
      border-radius: 16px;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }
    
    .logo-container {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      margin-bottom: 24px;
    }
    
    .logo-icon {
      width: 48px;
      height: 48px;
      background: #2563eb; /* Blue 600 */
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 20px rgba(37, 99, 235, 0.4);
    }
    
    .logo-icon svg {
      width: 28px;
      height: 28px;
      color: white;
    }
    
    h1 {
      margin: 0;
      font-size: 32px;
      font-weight: 800;
      letter-spacing: -0.5px;
    }
    
    h1 span {
      color: #3b82f6; /* Blue 500 */
    }
    
    .status-text {
      color: #94a3b8; /* Slate 400 */
      font-size: 14px;
      font-weight: 500;
      margin-top: 16px;
      letter-spacing: 0.5px;
    }
    
    .spinner {
      width: 40px;
      height: 40px;
      border: 3px solid rgba(255, 255, 255, 0.1);
      border-radius: 50%;
      border-top-color: #3b82f6;
      animation: spin 1s ease-in-out infinite;
    }
    
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    
    .pulse {
      animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
    }
    
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: .5; }
    }
  </style>
</head>
<body>

  <div class="logo-container">
    <div class="logo-icon pulse" style="background: transparent; box-shadow: none;">
      <img src="logo.png" alt="Logo" style="width: 100px; height: 100px; object-fit: contain;">
    </div>
    <h1>GREEN WAY <span>NET ZONE</span></h1>
  </div>
  
  <div class="spinner"></div>
  
  <div class="status-text" id="statusText">Starting core services...</div>

  <script>
    // Simple text rotation while waiting
    const messages = [
      "Starting core services...",
      "Connecting to database...",
      "Loading user interface...",
      "Almost ready..."
    ];
    let i = 0;
    setInterval(() => {
      i = (i + 1) % messages.length;
      document.getElementById('statusText').innerText = messages[i];
    }, 1500);
  </script>
</body>
</html>
